<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Our Discernment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Sage-anchored warm cream — a handwritten journal */
    --paper:#F7F2E7;        /* soft cream page */
    --paperDeep:#EFE8D6;    /* card / raised paper */
    --ink:#3A362B;          /* soft warm black ink */
    --inkSoft:#8A7F6A;      /* faded pencil */
    --sage:#7C8A66;         /* the anchor: soft sage */
    --sageDeep:#5E6B4A;     /* deep sage for emphasis */
    --clay:#C08552;         /* warm accent, used sparingly */
    --rule:#E2D8BF;         /* ruled-line color */
    --line:#DDD2B6;         /* hairline borders */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;color:var(--ink);font-family:Inter,system-ui,sans-serif;
    background-color:var(--paper);
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 22px 90px;}
  h1,h2,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;}
  .script{font-family:Caveat,'Segoe Script',cursive;}
  button{font-family:Inter,sans-serif;cursor:pointer;}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sage);outline-offset:2px;}
  ::placeholder{color:var(--inkSoft);opacity:.6;font-style:italic;}
  input,textarea{font-family:Inter,sans-serif;}
  .navbtn{background:none;border:none;color:var(--inkSoft);font-size:14px;padding:0;}
  .navbtn.active{color:var(--sageDeep);font-weight:600;}
  .linkbtn{background:none;border:none;color:var(--sageDeep);padding:0;font-size:12.5px;font-weight:600;}
  /* cards look like little pieces of paper, softly lifted */
  .card{background:var(--paperDeep);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(90,80,55,.06),0 6px 16px rgba(90,80,55,.05);}
  .primary{background:var(--sage);color:#FBF8EF;border:none;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:600;box-shadow:0 2px 6px rgba(94,107,74,.25);}
  .seg{flex:1;height:40px;border:1.5px solid var(--line);background:transparent;color:var(--inkSoft);border-radius:999px;font-family:Fraunces,serif;font-size:15px;transition:all .18s ease;}
  .seg.on{background:var(--sage);border-color:var(--sage);color:#FBF8EF;box-shadow:0 1px 4px rgba(94,107,74,.3);}
  .whopill{border:1.5px solid var(--sage);background:transparent;color:var(--sageDeep);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;}
  .whopill.on{background:var(--sage);color:#FBF8EF;}
  table{border-collapse:collapse;width:100%;min-width:520px;}
  th,td{padding:10px;border-bottom:1px solid var(--paperDeep);}
  th{font-size:12px;color:var(--inkSoft);font-weight:500;border-bottom:1px solid var(--line);text-align:center;}
  .status{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--sageDeep);color:#FBF8EF;font-size:12px;padding:9px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;box-shadow:0 4px 14px rgba(60,54,43,.25);}
  .status.show{opacity:.96;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<div id="status" class="status"></div>

<script>
/* ============================================================
   CONFIG — paste your JSONBin details here (instructions below)
   ============================================================ */
const BIN_ID  = "6a6bc98df5f4af5e29d7af69";
const API_KEY = "$2a$10$/zXxPU4AccL.MH1DkhyLmeK0SsgWZhOTApfGuy8zwKwXb7i0xACfm";
// Scoped access keys use "X-Access-Key"; a full master key uses "X-Master-Key".
const AUTH_HEADER = "X-Access-Key";
/* ============================================================ */

const MISSION = "We exist to love God and glorify him in our marriage by raising a family and sanctifying the world.";
const PEOPLE = ["Husband", "Wife"];
const CRITERIA = [
  { key:"culture", label:"Culture", hint:"The character and rhythm of daily life here." },
  { key:"beauty", label:"Beauty", hint:"Land, architecture, and the sense of a place worth loving." },
  { key:"church", label:"Catholic Church", hint:"Parish life, reverence, sacraments, community of faith." },
  { key:"affordability", label:"Affordability", hint:"Can a family live and grow here without strain?" },
  { key:"business", label:"Business Viability", hint:"Room to work, build, and provide." },
  { key:"community", label:"Community", hint:"Neighbors, friendship, belonging." },
  { key:"amenities", label:"Amenities", hint:"The practical goods of a settled life." },
  { key:"lifestyle", label:"Lifestyle", hint:"The shape of the life you'd actually live." },
];
const SEED = [
  { id:"boise", name:"Boise", region:"Idaho" },
  { id:"greenville-sc", name:"Greenville", region:"South Carolina" },
  { id:"greenville-tx", name:"Greenville", region:"Texas" },
];

/* ---------- who am I (per device) ---------- */
let ME = localStorage.getItem("discern:me") || null;
function setMe(n){ ME = n; localStorage.setItem("discern:me", n); }
function clearMe(){ ME = null; localStorage.removeItem("discern:me"); VIEW = { name:"home" }; render(); }

/* ---------- keyword extraction for mood boards ---------- */
const STOPWORDS = new Set(("a an and are as at be but by for from has have i if in is it its of on or "+
  "our so that the their them there they this to too very was we were what when where which who will "+
  "with you your me my mine ours us he she his her been being do does did not no yes here how than then "+
  "into out up down over under just about like really quite lot more most some any all can could would "+
  "should had having get got much many also because while though even still yet only own same such").split(" "));
/* pull notable words/short phrases from a note sentence */
function keywordsFrom(note){
  if(!note) return [];
  return note.toLowerCase()
    .replace(/[^a-z0-9\s'-]/g," ")
    .split(/\s+/)
    .map(w=>w.replace(/^['-]+|['-]+$/g,""))
    .filter(w=>w.length>2 && !STOPWORDS.has(w));
}

/* ---------- cloud storage (JSONBin) ---------- */
const BASE = "https://api.jsonbin.io/v3/b/" + BIN_ID;
const configured = () => BIN_ID && !BIN_ID.includes("PASTE") && API_KEY && !API_KEY.includes("PASTE");

let STATE = null;
let saveTimer = null;

function blankPlace(loc){ return { ...loc, scores:{}, photos:[] }; }
function freshState(){ return { places: SEED.map(blankPlace) }; }

/* migrate older shapes: entries->photos, drop global board */
function migrate(s){
  if(!s || !Array.isArray(s.places)) return s;
  s.places.forEach(p=>{
    if(!Array.isArray(p.photos)) p.photos = [];
    if(Array.isArray(p.entries)){
      p.entries.forEach(e=>{ if(e.image) p.photos.push({ id:e.id||String(Math.random()), image:e.image, author:e.author||"", createdAt:e.createdAt||Date.now() }); });
      delete p.entries;
    }
    if("board" in p) delete p.board;
  });
  if("board" in s) delete s.board;
  return s;
}

function toast(msg){
  const s = document.getElementById("status");
  s.textContent = msg; s.classList.add("show");
  clearTimeout(s._t); s._t = setTimeout(()=>s.classList.remove("show"), 1600);
}

async function loadCloud(){
  if(!configured()){ STATE = freshState(); return; }
  try{
    const r = await fetch(BASE + "/latest", { headers:{ [AUTH_HEADER]: API_KEY }});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const rec = j.record;
    // Use saved data only if it actually has places; otherwise seed the cities.
    if(rec && Array.isArray(rec.places) && rec.places.length > 0){
      STATE = migrate(rec);
    } else {
      STATE = freshState();
      await pushCloud();   // write the seeded cities back so both devices share them
    }
  }catch(e){
    console.error(e); STATE = freshState();
    toast("Couldn't reach the cloud — working offline");
  }
}

async function pushCloud(){
  if(!configured()) return;
  try{
    const r = await fetch(BASE, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", [AUTH_HEADER]: API_KEY },
      body: JSON.stringify(STATE),
    });
    if(!r.ok) throw new Error(r.status);
    toast("Saved");
  }catch(e){ console.error(e); toast("Couldn't save — the key may be read-only"); }
}

/* debounced save so rapid taps don't spam the API */
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 700); }

/* True while the user is mid-edit: a text field (e.g. a rating note) is focused.
   Keeps the background refresh from rebuilding the page and ejecting the cursor. */
function isEditing(){
  const a = document.activeElement;
  return !!(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"));
}

/* pull fresh data periodically so spouses see each other's work */
async function refresh(){
  if(!configured()) return;
  if(isEditing()) return;   // never yank the page out from under someone who's writing
  try{
    const r = await fetch(BASE + "/latest", { headers:{ [AUTH_HEADER]: API_KEY }});
    if(!r.ok) return;
    const j = await r.json();
    if(j.record && Array.isArray(j.record.places) && j.record.places.length > 0){
      // Re-check right before we replace the page — a field may have been focused during the fetch.
      if(isEditing()) return;
      STATE = migrate(j.record);
      render();
    }
  }catch(e){/* ignore */}
}

/* ---------- helpers ---------- */
const el = (tag, props={}, ...kids) => {
  const n = document.createElement(tag);
  for(const k in props){
    if(k==="style") Object.assign(n.style, props[k]);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if(k==="class") n.className = props[k];
    else if(k==="html") n.innerHTML = props[k];
    else n.setAttribute(k, props[k]);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
};
const place = id => STATE.places.find(p=>p.id===id);

/* average of a criterion across both people.
   When gated, the combined value is hidden unless the current viewer (ME) has rated it —
   so no one sees a blended number containing data they haven't matched. */
function critAvg(p, key, gated){
  if(gated && !(p.scores?.[key]?.[ME]?.value > 0)) return null;
  const vals = PEOPLE.map(who => p.scores?.[key]?.[who]?.value).filter(v=>v>0);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
/* overall average for a place. When gated, it's built only from the metrics
   the current viewer has personally rated. */
function placeAvg(p, gated){
  const vals = CRITERIA.map(c=>critAvg(p,c.key,gated)).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

/* Pool keywords for a location's mood board from both spouses' metric notes.
   Anchoring rule: a spouse's words for a metric are hidden until ME has rated that metric.
   Returns [{word, weight}] sorted by how often the word recurs. */
function boardKeywords(p){
  const counts = new Map();
  const other = PEOPLE.find(n=>n!==ME);
  CRITERIA.forEach(c=>{
    const iRated = p.scores?.[c.key]?.[ME]?.value > 0;
    // my own note always counts
    keywordsFrom(p.scores?.[c.key]?.[ME]?.note).forEach(w=>counts.set(w,(counts.get(w)||0)+1));
    // spouse's note only once I've rated this metric
    if(iRated) keywordsFrom(p.scores?.[c.key]?.[other]?.note).forEach(w=>counts.set(w,(counts.get(w)||0)+1));
  });
  return [...counts.entries()]
    .map(([word,weight])=>({word,weight}))
    .sort((a,b)=> b.weight-a.weight || a.word.localeCompare(b.word));
}

/* ---------- views ---------- */
let VIEW = { name:"home" };

function frame(){
  return el("div",{style:{padding:"36px 0 24px",borderBottom:"1.5px solid var(--line)"}},
    el("div",{class:"script",style:{color:"var(--clay)",fontSize:"22px",fontWeight:"600"}}, "Our Discernment"),
    el("p",{class:"script",style:{fontSize:"32px",lineHeight:"1.3",margin:"6px 0 0",color:"var(--sageDeep)"}}, "\u201C"+MISSION+"\u201D"),
    el("div",{style:{fontSize:"12.5px",color:"var(--inkSoft)",marginTop:"10px",fontStyle:"italic"}}, "Every score and image below is weighed against this end."),
  );
}

function backBar(){
  return el("button",{class:"navbtn",style:{display:"flex",alignItems:"center",gap:"5px",padding:"22px 0 4px",color:"var(--sage)",fontWeight:"600"},
    onClick:()=>{VIEW={name:"home"};render();}}, "‹ All places");
}
function sectionLabel(t){
  return el("div",{class:"script",style:{marginTop:"38px",marginBottom:"2px",fontSize:"26px",color:"var(--clay)"}}, t);
}

/* who-picker gate */
function whoGate(){
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.append(
    frame(),
    el("div",{style:{marginTop:"40px",textAlign:"center"}},
      el("div",{class:"script",style:{fontSize:"40px",marginBottom:"2px",color:"var(--sageDeep)"}}, "Who's discerning?"),
      el("div",{style:{fontSize:"14px",color:"var(--inkSoft)",marginBottom:"24px"}}, "This device will remember your choice."),
      el("div",{style:{display:"flex",gap:"14px",justifyContent:"center"}},
        ...PEOPLE.map(n => el("button",{class:"whopill",style:{padding:"14px 30px",fontSize:"16px"},
          onClick:()=>{ setMe(n); render(); }}, n))
      )
    )
  );
}

function home(){
  const ranked = [...STATE.places].sort((a,b)=>(placeAvg(b,true)??-1)-(placeAvg(a,true)??-1));
  const root = document.getElementById("root"); root.innerHTML="";
  root.append(
    frame(),
    el("nav",{style:{display:"flex",gap:"18px",padding:"18px 0",fontSize:"14px",alignItems:"center"}},
      el("span",{class:"navbtn active"}, "Places"),
      el("button",{class:"navbtn",onClick:()=>{VIEW={name:"compare"};render();}}, "At a glance"),
      el("button",{class:"navbtn",onClick:()=>{VIEW={name:"boards"};render();}}, "Mood board")
    ),
    el("div",{style:{display:"grid",gap:"16px",marginTop:"6px"}},
      ...ranked.map(p=>{
        const a = placeAvg(p, true);
        const rated = CRITERIA.filter(c=>p.scores?.[c.key]?.[ME]?.value > 0).length;
        return el("button",{class:"card",style:{textAlign:"left",padding:"20px 22px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"16px"},
          onClick:()=>{VIEW={name:"place",id:p.id};render();}},
          el("div",{},
            el("div",{class:"script",style:{fontSize:"34px",lineHeight:"1",color:"var(--ink)"}}, p.name),
            el("div",{style:{fontSize:"13px",color:"var(--inkSoft)",marginTop:"2px",fontStyle:"italic"}}, p.region),
            el("div",{style:{fontSize:"12.5px",color:"var(--sage)",marginTop:"8px"}},
              p.photos.length+" "+(p.photos.length===1?"photo":"photos")+" · you've rated "+rated+"/8"),
          ),
          el("div",{style:{textAlign:"center"}},
            el("div",{class:"serif",style:{fontSize:"40px",lineHeight:"1",color:a?"var(--sage)":"var(--line)"}}, a?a.toFixed(1):"—"),
            el("div",{style:{fontSize:"10px",letterSpacing:"2px",color:"var(--inkSoft)",textTransform:"uppercase",marginTop:"4px"}}, "of 7")
          )
        );
      })
    ),
    switchBar()
  );
}

/* bottom-of-page identity + switch control */
function switchBar(){
  return el("div",{style:{marginTop:"40px",paddingTop:"20px",borderTop:"1px solid var(--line)",textAlign:"center"}},
    el("div",{style:{fontSize:"13px",color:"var(--inkSoft)"}}, "Signed in as ",
      el("b",{style:{color:"var(--sageDeep)",fontWeight:"600"}}, ME)),
    el("button",{class:"whopill",style:{marginTop:"10px"},onClick:clearMe}, "Switch spouse")
  );
}

function scaleRow(p, crit){
  const mine = p.scores?.[crit.key]?.[ME] || {};
  const other = PEOPLE.find(n=>n!==ME);
  const theirs = p.scores?.[crit.key]?.[other] || {};
  const a = critAvg(p, crit.key);

  const setVal = (n) => {
    p.scores[crit.key] = p.scores[crit.key] || {};
    p.scores[crit.key][ME] = { ...mine, value: (mine.value===n?0:n) };
    save(); render();
  };
  const setNote = (v) => {
    p.scores[crit.key] = p.scores[crit.key] || {};
    p.scores[crit.key][ME] = { ...(p.scores[crit.key][ME]||{}), note:v };
    save();
  };

  const segs = el("div",{style:{display:"flex",gap:"6px",marginTop:"12px"}});
  for(let n=1;n<=7;n++){
    segs.append(el("button",{class:"seg"+(n<=(mine.value||0)?" on":""),onClick:()=>setVal(n),"aria-label":crit.label+" "+n+" of 7"}, String(n)));
  }

  const noteInput = el("input",{value:mine.note||"",placeholder:"Your note on why…",
    style:{marginTop:"10px",width:"100%",background:"transparent",border:"none",borderBottom:"1px dashed var(--line)",padding:"6px 2px",fontSize:"14px",color:"var(--ink)",outline:"none"}});
  noteInput.addEventListener("input", e=>setNote(e.target.value));

  const iRated = !!mine.value;   // only reveal spouse + combined once I've rated this metric

  const badges = el("div",{style:{display:"flex",gap:"14px",marginTop:"10px",fontSize:"12.5px",flexWrap:"wrap",alignItems:"baseline"}},
    el("span",{style:{color:"var(--inkSoft)"}}, "You: ",
      el("b",{style:{color:mine.value?"var(--sage)":"var(--line)",fontFamily:"Fraunces,serif",fontSize:"15px"}}, mine.value||"—")),
    iRated
      ? el("span",{style:{color:"var(--inkSoft)"}}, other+": ",
          el("b",{style:{color:theirs.value?"var(--sage)":"var(--line)",fontFamily:"Fraunces,serif",fontSize:"15px"}}, theirs.value||"—"))
      : el("span",{style:{color:"var(--inkSoft)",fontStyle:"italic",opacity:".7"}}, other+": hidden until you rate"),
    iRated
      ? el("span",{style:{color:"var(--inkSoft)",marginLeft:"auto"}}, "Combined: ",
          el("b",{style:{color:a?"var(--sageDeep)":"var(--line)",fontFamily:"Fraunces,serif",fontSize:"15px"}}, a?a.toFixed(1):"—"))
      : null,
  );

  return el("div",{style:{padding:"18px 0",borderBottom:"1px solid var(--line)"}},
    el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"12px"}},
      el("div",{},
        el("div",{class:"serif",style:{fontSize:"19px"}}, crit.label),
        el("div",{style:{fontSize:"12.5px",color:"var(--inkSoft)",marginTop:"2px"}}, crit.hint)
      )
    ),
    segs, badges, noteInput,
    (iRated && theirs.note) ? el("div",{style:{fontSize:"12.5px",color:"var(--sage)",marginTop:"6px",fontStyle:"italic"}}, other+" noted: \u201C"+theirs.note+"\u201D") : null
  );
}

function photoUploader(p){
  const fileInput = el("input",{type:"file",accept:"image/*",style:{display:"none"}});
  fileInput.addEventListener("change", e=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    let pending = files.length;
    files.forEach(f=>{
      const rd = new FileReader();
      rd.onload = ()=>{
        p.photos.unshift({ id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()), image:rd.result, author:ME, createdAt:Date.now() });
        if(--pending===0){ save(); render(); }
      };
      rd.readAsDataURL(f);
    });
  });

  return el("div",{class:"card",style:{padding:"16px",display:"flex",flexDirection:"column",alignItems:"center",gap:"8px",textAlign:"center"}},
    el("label",{class:"primary",style:{display:"inline-flex",alignItems:"center",gap:"8px",cursor:"pointer"}}, "▣ Add photos to the board", fileInput),
    el("div",{style:{fontSize:"12.5px",color:"var(--inkSoft)",fontStyle:"italic"}}, "Pictures you add join "+p.name+"'s mood board.")
  );
}

function placeView(){
  const p = place(VIEW.id);
  const root = document.getElementById("root"); root.innerHTML="";
  root.append(
    backBar(),
    el("div",{style:{padding:"8px 0 20px",borderBottom:"1.5px solid var(--line)"}},
      el("div",{class:"script",style:{fontSize:"52px",lineHeight:"1",color:"var(--ink)"}}, p.name),
      el("div",{style:{fontSize:"14px",color:"var(--inkSoft)",marginTop:"2px",fontStyle:"italic"}}, p.region),
      el("div",{style:{fontSize:"12.5px",color:"var(--sageDeep)",fontStyle:"italic",marginTop:"14px"}}, "Held against: "+MISSION.toLowerCase())
    ),
    sectionLabel("How it feels, 1 to 7"),
    el("div",{style:{fontSize:"12.5px",color:"var(--inkSoft)",fontStyle:"italic",marginTop:"2px",marginBottom:"4px"}}, "You're writing as "+ME+". Your notes become keywords on the mood board."),
    ...CRITERIA.map(c=>scaleRow(p,c)),
    sectionLabel("Mood board"),
    el("div",{style:{fontSize:"12.5px",color:"var(--inkSoft)",fontStyle:"italic",marginTop:"2px",marginBottom:"10px"}}, "Photos and words from both of you, gathered into one emotional picture of "+p.name+"."),
    photoUploader(p),
    el("button",{class:"card",style:{marginTop:"14px",width:"100%",textAlign:"left",padding:"18px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"12px",cursor:"pointer"},
      onClick:()=>{VIEW={name:"mood",id:p.id};render();}},
      el("div",{},
        el("div",{class:"script",style:{fontSize:"26px",color:"var(--sageDeep)"}}, "Open "+p.name+"'s board"),
        el("div",{style:{fontSize:"12.5px",color:"var(--inkSoft)",marginTop:"2px"}},
          p.photos.length+" "+(p.photos.length===1?"photo":"photos")+" · "+boardKeywords(p).length+" words")
      ),
      el("span",{style:{fontSize:"22px",color:"var(--sage)"}}, "›")
    )
  );
}

function compareView(){
  const root=document.getElementById("root"); root.innerHTML="";
  const head = el("tr",{}, el("th",{style:{textAlign:"left"}},""),
    ...STATE.places.map(p=>el("th",{class:"serif",style:{fontWeight:"600"}}, p.name, el("div",{style:{fontSize:"11px",color:"var(--inkSoft)",fontWeight:"400"}}, p.region))));
  const body = el("tbody",{});
  CRITERIA.forEach(c=>{
    const raw = STATE.places.map(p=>critAvg(p,c.key,true));   // null where I haven't rated
    const best = Math.max(...raw.map(v=>v??0));
    const row = el("tr",{}, el("td",{style:{fontSize:"13.5px",textAlign:"left"}}, c.label));
    STATE.places.forEach((p,i)=>{
      const v=raw[i], lead=v!=null&&v>0&&v===best;
      row.append(el("td",{},
        el("div",{style:{display:"inline-flex",flexDirection:"column",alignItems:"center",width:"64px"}},
          el("div",{class:"serif",style:{fontSize:"17px",color:v!=null?(lead?"var(--sageDeep)":"var(--ink)"):"var(--line)",fontWeight:lead?"600":"400"}}, v!=null?v.toFixed(1):"—"),
          el("div",{style:{height:"5px",width:"100%",background:"var(--line)",borderRadius:"3px",marginTop:"4px",overflow:"hidden"}},
            el("div",{style:{height:"100%",width:(((v??0)/7)*100)+"%",background:"var(--sage)"}}))
        )));
    });
    body.append(row);
  });
  const overall = STATE.places.map(p=>placeAvg(p,true)??-1);
  const oBest = Math.max(...overall);
  const oRow = el("tr",{}, el("td",{class:"serif",style:{fontSize:"15px",textAlign:"left",borderTop:"2px solid var(--sage)"}}, "Overall"));
  STATE.places.forEach((p,i)=>{
    const a=placeAvg(p,true), lead=a!=null&&a===oBest;
    oRow.append(el("td",{style:{borderTop:"2px solid var(--sage)"}},
      el("span",{class:"serif",style:{fontSize:"28px",color:a?(lead?"var(--sageDeep)":"var(--ink)"):"var(--line)"}}, a?a.toFixed(1):"—")));
  });
  body.append(oRow);

  root.append(
    backBar(),
    el("div",{style:{padding:"8px 0 18px",borderBottom:"1.5px solid var(--line)"}},
      el("div",{class:"script",style:{fontSize:"46px",color:"var(--sageDeep)"}}, "At a Glance"),
      el("div",{style:{fontSize:"13px",color:"var(--inkSoft)",marginTop:"2px",fontStyle:"italic"}}, "Combined scores appear only where you've rated first. A dash means you haven't weighed in yet.")),
    el("div",{style:{overflowX:"auto",marginTop:"18px"}}, el("table",{}, el("thead",{},head), body))
  );
}

function boardsListView(){
  const root=document.getElementById("root"); root.innerHTML="";
  root.append(
    backBar(),
    el("div",{style:{padding:"8px 0 18px",borderBottom:"1.5px solid var(--line)"}},
      el("div",{class:"script",style:{fontSize:"46px",color:"var(--sageDeep)"}}, "Mood Boards"),
      el("div",{style:{fontSize:"13px",color:"var(--inkSoft)",marginTop:"2px",fontStyle:"italic"}}, "The feel of each place, at a glance. Tap one to open its board.")),
    el("div",{style:{display:"grid",gap:"16px",marginTop:"20px"}},
      ...STATE.places.map(p=>{
        const words = boardKeywords(p);
        const preview = words.slice(0,5).map(w=>w.word).join(" · ");
        const thumb = p.photos[0];
        return el("button",{class:"card",style:{textAlign:"left",padding:"0",display:"flex",alignItems:"stretch",gap:"0",overflow:"hidden",cursor:"pointer"},
          onClick:()=>{VIEW={name:"mood",id:p.id};render();}},
          thumb
            ? el("img",{src:thumb.image,alt:"",style:{width:"96px",objectFit:"cover",flexShrink:"0"}})
            : el("div",{style:{width:"96px",flexShrink:"0",background:"var(--paperDeep)",display:"grid",placeItems:"center",color:"var(--line)",fontSize:"24px"}}, "▣"),
          el("div",{style:{padding:"16px 18px",flex:"1",minWidth:"0"}},
            el("div",{class:"script",style:{fontSize:"30px",lineHeight:"1",color:"var(--ink)"}}, p.name),
            el("div",{style:{fontSize:"12px",color:"var(--inkSoft)",fontStyle:"italic",marginTop:"1px"}}, p.region),
            el("div",{style:{fontSize:"12.5px",color:"var(--sage)",marginTop:"8px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
              preview || (p.photos.length? p.photos.length+" photos" : "Empty so far")),
          ),
          el("span",{style:{alignSelf:"center",paddingRight:"16px",fontSize:"22px",color:"var(--sage)"}}, "›")
        );
      })
    ),
    switchBar()
  );
}

function moodView(){
  const p = place(VIEW.id);
  const root=document.getElementById("root"); root.innerHTML="";
  const words = boardKeywords(p);
  const maxW = words.length ? words[0].weight : 1;

  // keyword cloud — size and depth scale with recurrence
  const cloud = el("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px 10px",alignItems:"center",margin:"4px 0 22px"}});
  if(words.length===0){
    cloud.append(el("div",{style:{fontSize:"13px",color:"var(--inkSoft)",fontStyle:"italic"}},
      "No words yet. Add notes to the ratings and they'll gather here."));
  }
  words.forEach(({word,weight})=>{
    const t = weight/maxW;                         // 0..1
    const size = 15 + Math.round(t*17);            // 15–32px
    const col = t>0.66? "var(--sageDeep)" : t>0.33? "var(--sage)" : "var(--clay)";
    cloud.append(el("span",{class:"script",style:{fontSize:size+"px",lineHeight:"1",color:col,fontWeight: t>0.5?"700":"600"}}, word));
  });

  // photo mosaic
  const grid = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"6px"}});
  if(p.photos.length===0){
    grid.append(el("div",{style:{gridColumn:"1 / -1",padding:"30px",textAlign:"center",color:"var(--inkSoft)",fontStyle:"italic",fontSize:"14px",border:"1px dashed var(--line)",borderRadius:"10px"}},
      "No photos yet. Add a few to see "+p.name+" take shape."));
  }
  p.photos.forEach(ph=>{
    const cell = el("div",{style:{position:"relative",aspectRatio:"1",overflow:"hidden",borderRadius:"8px"}},
      el("img",{src:ph.image,alt:"",style:{width:"100%",height:"100%",objectFit:"cover",display:"block"}}),
      el("button",{"aria-label":"Remove photo",style:{position:"absolute",top:"4px",right:"4px",background:"rgba(58,54,43,.72)",color:"var(--paper)",border:"none",borderRadius:"999px",width:"22px",height:"22px",fontSize:"12px",lineHeight:"1",cursor:"pointer"},
        onClick:()=>{ p.photos = p.photos.filter(x=>x.id!==ph.id); save(); render(); }}, "✕")
    );
    grid.append(cell);
  });

  root.append(
    el("button",{class:"navbtn",style:{display:"flex",alignItems:"center",gap:"5px",padding:"22px 0 4px",color:"var(--sage)",fontWeight:"600"},
      onClick:()=>{VIEW={name:"place",id:p.id};render();}}, "‹ Back to "+p.name),
    el("div",{style:{padding:"8px 0 18px",borderBottom:"1.5px solid var(--line)"}},
      el("div",{class:"script",style:{fontSize:"48px",color:"var(--sageDeep)",lineHeight:"1"}}, p.name),
      el("div",{style:{fontSize:"13px",color:"var(--inkSoft)",marginTop:"2px",fontStyle:"italic"}}, "The feel of the place, at a glance — from both of you.")),
    el("div",{style:{marginTop:"20px"}}, cloud),
    photoUploader(p),
    el("div",{style:{marginTop:"16px"}}, grid)
  );
}

/* ---------- render dispatch ---------- */
function render(){
  if(!STATE){ return; }
  if(!ME){ whoGate(); return; }
  if(VIEW.name==="home") home();
  else if(VIEW.name==="place") placeView();
  else if(VIEW.name==="compare") compareView();
  else if(VIEW.name==="boards") boardsListView();
  else if(VIEW.name==="mood") moodView();
}

/* ---------- boot ---------- */
(async function(){
  document.getElementById("root").innerHTML =
    '<div style="min-height:60vh;display:grid;place-items:center;color:var(--inkSoft);font-family:Fraunces,serif;">Opening the journal…</div>';
  await loadCloud();
  render();
  if(!configured()){
    toast("Add your JSONBin keys to sync — see instructions");
  }
  /* pull spouse's updates every 20s */
  setInterval(refresh, 20000);
  /* also refresh when the tab regains focus */
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(); });
})();
</script>
</body>
</html>
